    <!-- 텔레그램 미니앱 SDK. 일반 브라우저에서는 로드에 실패해도 아래 어댑터가 조용히 건너뜁니다. -->
    <!-- LINE 미니앱(LIFF) SDK — LINE 앱 웹뷰가 아니면 아래 어댑터가 조용히 건너뜁니다. -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* 환경 어댑터 — 텔레그램 미니앱 안이면 ready·expand를 자동 실행하고,
         일반 브라우저·PWA 환경에서는 아무 것도 하지 않습니다(오류 0건). */
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg && typeof tg.ready === 'function') tg.ready();
          if (tg && typeof tg.expand === 'function') tg.expand();
          if (tg && typeof tg.disableVerticalSwipes === 'function') {
            try { tg.disableVerticalSwipes(); } catch (e) {}
          }
          if (tg && typeof tg.setHeaderColor === 'function') {
            try { tg.setHeaderColor('#f7f3ff'); } catch (e) {}
          }
          if (tg && typeof tg.setBackgroundColor === 'function') {
            try { tg.setBackgroundColor('#f7f3ff'); } catch (e) {}
          }
        } catch (e) {}
        /* ── LINE(LIFF) 3중 호환 어댑터 ─────────────────────────────
           · LINE 앱 웹뷰: LIFF ID가 있으면 초기화하고, 언어를 알려 줍니다.
           · 일반 브라우저·텔레그램: SDK가 없거나 초기화에 실패해도 아무 것도 하지 않습니다(오류 0건).
           · LIFF ID(meta[name=liff-id])가 비어 있으면 초기화를 시도하지 않습니다. */
        window.__PICKLE_LIFF__ = { inLine: false, ready: false, lang: null };
        (function () {
          var bridge = window.__PICKLE_LIFF__;
          try {
            var ua = navigator.userAgent || '';
            bridge.inLine = /Line\/\d/i.test(ua) || /LIFF/i.test(ua);
          } catch (e) {}

          function readLang() {
            try {
              if (window.liff && typeof window.liff.getLanguage === 'function') {
                var value = window.liff.getLanguage();
                if (value) bridge.lang = String(value).slice(0, 2).toLowerCase();
              }
            } catch (e) {}
          }

          function start() {
            var meta = document.querySelector('meta[name="liff-id"]');
            var liffId = meta && meta.getAttribute('content') ? meta.getAttribute('content').trim() : '';
            readLang();
            if (!liffId || !window.liff || typeof window.liff.init !== 'function') return;
            window.liff
              .init({ liffId: liffId })
              .then(function () {
                bridge.ready = true;
                try {
                  if (typeof window.liff.isInClient === 'function' && window.liff.isInClient()) bridge.inLine = true;
                } catch (e) {}
                readLang();
                if (bridge.inLine) {
                  document.documentElement.classList.add('in-line');
                  document.documentElement.lang = bridge.lang || document.documentElement.lang;
                }
              })
              .catch(function () {});
          }

          if (document.readyState === 'complete') start();
          else window.addEventListener('load', start);
        })();

        /* PWA 서비스 워커 등록 — 보안 문맥(https·localhost)에서만, 실패해도 앱 동작에는 지장 없음 */
        if (
          'serviceWorker' in navigator &&
          (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {});
          });
        }
      })();
    </script>
